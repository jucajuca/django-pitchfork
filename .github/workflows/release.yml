name: Release

# PyPI release (bolt's pattern: `just release VERSION=` bumps/commits/tags/
# pushes; this workflow builds and publishes on the tag). Version-specific
# wheels per the architecture decision (abi3 doesn't cover the py3.10 floor).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: pyo3/maturin-action@v1
        with:
          args: --out dist --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  wheels-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Derived from pyproject.toml classifiers (see
        # scripts/check_support_matrix.py).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel (manylinux)
        uses: pyo3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist -i python${{ matrix.python-version }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python-version }}
          path: dist

  wheels-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel (macOS)
        uses: pyo3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist -i python${{ matrix.python-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python-version }}
          path: dist

  publish:
    needs: [sdist, wheels-linux, wheels-macos]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted publishing (no API token needed).
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
